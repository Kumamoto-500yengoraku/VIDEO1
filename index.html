<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熊本500円娯楽マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --green:#526f4e;
  --dark:#252b28;
  --cream:#f5f1e8;
  --line:#ded8ca;
  --red:#a7463d;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:var(--cream);color:#26352e}
header{
  background-color:#343a36;
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 47px,
      rgba(220,215,200,0.22) 48px,
      transparent 51px
    ),
    repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 95px,
      rgba(220,215,200,0.22) 96px,
      transparent 99px
    );
  color:white;
  padding:32px 16px;
  text-align:center;
  border-bottom:5px solid #a7463d;
}

header h1{
  margin:0;
  font-size:clamp(24px,4vw,36px);
  letter-spacing:2px;
  font-weight:800;
  text-shadow:0 2px 5px #00000080;
}

header p{
  margin:10px 0 0;
  color:#e5e8df;
  font-size:14px;
}
main{max-width:1180px;margin:20px auto;padding:0 14px;display:grid;grid-template-columns:340px 1fr;gap:16px}
.panel,.map-panel{
  background:#fffdf8;
  border:1px solid #d8d0bf;
  border-radius:14px;
  padding:16px;
  box-shadow:0 4px 14px rgba(45,48,40,0.10);
}

.map-panel{
  border-top:5px solid #526f4e;
}
h2{font-size:18px;margin:0 0 14px;color:var(--dark)}
label{display:block;font-weight:650;font-size:14px;margin:12px 0 6px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd8d0;border-radius:8px;background:white}
input[type=range]{padding:0;accent-color:var(--green)}
textarea{min-height:75px;resize:vertical}
button{border:0;border-radius:8px;padding:10px 13px;background:var(--green);color:white;font-weight:700;cursor:pointer}
button.secondary{background:#e9f1ec;color:var(--dark)}
button.danger{background:#b74444}
button:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
#map{height:570px;border-radius:10px;z-index:1}
.map-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
#status{font-size:13px;color:#557264;margin:8px 0}
.spot-list{margin-top:14px;display:grid;gap:9px}
.spot{border:1px solid var(--line);border-radius:9px;padding:10px}
.spot strong{display:block}
.spot small{color:#607368}
.spot-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.spot-actions button{font-size:12px;padding:7px}
.hidden{display:none!important}
.muted{font-size:12px;color:#718078}
.admin-box{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.report{border:1px solid var(--line);padding:9px;border-radius:8px;margin:8px 0;font-size:13px}
footer{text-align:center;color:#718078;padding:20px;font-size:12px}
@media(max-width:850px){
 main{grid-template-columns:1fr}
 #map{height:440px}
}
/* 熊耳付き地図ピン */
.bear-pin{
  position:relative;
  width:36px;
  height:46px;
  animation:bearPop .45s ease-out both;
}

/* 緑色のピン本体 */
.bear-pin .pin-body{
  position:absolute;
  left:3px;
  top:3px;
  width:30px;
  height:30px;
  background:#526f4e;
  border:2px solid white;
  border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  box-shadow:0 2px 5px #0005;
}

/* 熊耳付き黒色地図ピン */
.bear-marker{
  background:transparent;
  border:none;
}

.bear-pin{
  width:40px;
  height:52px;
  transform-origin:50% 100%;
  animation:bearPop .45s ease-out both;
}

.bear-pin svg{
  display:block;
  width:40px;
  height:52px;
  overflow:visible;
}

/* ポンッと登場するアニメーション */
@keyframes bearPop{
  0%{
    transform:scale(0);
    opacity:0;
  }
  70%{
    transform:scale(1.2);
    opacity:1;
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

@media(prefers-reduced-motion:reduce){
  .bear-pin{animation:none}
}
  0%{transform:scale(0);opacity:0}
  70%{transform:scale(1.2);opacity:1}
  100%{transform:scale(1);opacity:1}
}
</style>
</head>

<header>
<h1>熊本500円娯楽マップ</h1>
<p>ワンコイン以下で楽しめる、熊本のスポットを見つけよう。</p>

<form id="spotForm">

<label>ジャンル</label>

<option value="観光">観光</option>
<option value="体験">体験</option>
</select>

<label>料金（0〜500円）</label>
<input name="cost" type="number" min="0" max="500" required>

<label>住所・場所</label>
<input name="address" maxlength="160" required>

<label>紹介文</label>
<textarea name="desc" maxlength="300" required></textarea>

<div class="row">
<div>
<label>緯度（任意）</label>
<input name="lat" type="number" step="any" placeholder="例：32.8031">
</div>
<div>
<label>経度（任意）</label>
<input name="lng" type="number" step="any" placeholder="例：130.7079">
</div>
</div>

<p><button type="submit">投稿する</button></p>
</form>
</details>
 
<div id="status">データを読み込んでいます…</div>
<div id="spotList" class="spot-list"></div>

<details class="admin-box">
<summary>＋ スポットを投稿する</summary>
<p class="muted">投稿には匿名認証を使用します。</p>

<form id="spotForm">
<label>スポット名</label>
<input name="name" maxlength="80" required>

<label>ジャンル</label>
<select name="genre" required>
<option value="グルメ">グルメ</option>
<option value="自然">自然</option>
<option value="観光">観光</option>
<option value="体験">体験</option>
</select>

<label>料金（0〜500円）</label>
<input name="cost" type="number" min="0" max="500" required>

<label>住所・場所</label>
<input name="address" maxlength="160" required>

<label>紹介文</label>
<textarea name="desc" maxlength="300" required></textarea>

<div class="row">
<div>
<label>緯度（任意）</label>
<input name="lat" type="number" step="any" placeholder="例：32.8031">
</div>
<div>
<label>経度（任意）</label>
<input name="lng" type="number" step="any" placeholder="例：130.7079">
</div>
</div>

<p><button type="submit">投稿する</button></p>
</form>
</details>
 
<div id="adminArea" class="hidden">
<div class="admin-box">
<h2>管理者メニュー</h2>
<p class="muted">管理者としてログイン中です。</p>

<div class="row">
<button id="seedButton" class="secondary" type="button">初期スポットを登録</button>
<button id="logoutButton" class="danger" type="button">ログアウト</button>
</div>

<h2 style="margin-top:18px">報告一覧</h2>
<div id="reportList"></div>
</div>
</div>

<div id="loginArea" class="admin-box">
<h2>管理者ログイン</h2>
<form id="loginForm">
<label>メールアドレス</label>
<input name="email" type="email" required>

<label>パスワード</label>
<input name="password" type="password" required>

<p><button type="submit" class="secondary">ログイン</button></p>
</form>
</div>
</div>
</section>

<section class="map-panel">
<div class="map-head">
<h2>熊本市周辺のマップ</h2>
<button id="exportButton" class="secondary" type="button">データを書き出す</button>
</div>
<div id="map"></div>
<p class="muted">地図上のマーカーを押すとスポットの詳細を確認できます。</p>
</section>
</main>

<footer>
掲載情報は投稿内容に基づきます。訪問前に料金・営業状況をご確認ください。
</footer>
